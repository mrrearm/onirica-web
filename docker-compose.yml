services:
  onirica-web:
    build: .
    image: onirica-web:latest
    container_name: onirica-web
    restart: unless-stopped
    ports:
      - "3020:3020"
    volumes:
      - ./data:/app/data
    # env_file carica automaticamente TUTTE le variabili presenti nel
    # file .env locale (GROQ_API_KEY, JWT_SECRET, TURSO_DATABASE_URL,
    # TURSO_AUTH_TOKEN, ecc.) senza doverle elencare una per una qui.
    # Il file .env non va mai committato nel repository.
    env_file:
      - .env
    environment:
      - PORT=3020
